databases:
  - name: crm-portal-db
    plan: free
    databaseName: crm_portal
    user: crm_user

services:
  - type: web
    plan: free
    name: crm-portal-backend
    runtime: node
    buildCommand: cd packages/backend && npm install && npx prisma generate && npm run build
    startCommand: cd packages/backend && npx prisma db push --verbose 2>&1 && npx prisma generate 2>&1 && npm run prisma:seed 2>&1 && npm run start 2>&1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: crm-portal-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://crm-portal-admin-9f2z.vercel.app
