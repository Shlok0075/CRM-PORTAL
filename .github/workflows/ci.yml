name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install root deps
        run: npm install
      - name: Install backend deps
        run: |
          cd packages/backend
          npm install
      - name: Generate Prisma Client
        run: |
          cd packages/backend
          npx prisma generate
      - name: Build backend
        run: |
          cd packages/backend
          npm run build || true
      - name: Build admin
        run: |
          cd packages/admin
          npm install || true
          npm run build || true
      - name: Build founder
        run: |
          cd packages/founder
          npm install || true
          npm run build || true
